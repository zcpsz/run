name: "🧪 Test macOS Runner Image"

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Runner label to test (e.g. getmac-tahoe, getmac-sequoia)"
        required: true
        default: "getmac-tahoe"
        type: string

jobs:
  test-image:
    name: "🧪 Test macOS Image"
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 90
    steps:

      # ──────────────────────────────────────────
      # 1. Environment & Toolchain Verification
      # ──────────────────────────────────────────
      - name: "🔍 System info"
        run: |
          echo "::group::Hardware"
          uname -m
          sysctl -n hw.memsize | awk '{printf "Memory: %.0f GB\n", $1/1073741824}'
          system_profiler SPHardwareDataType | grep -E "Chip|Cores|Memory"
          echo "::endgroup::"

          echo "::group::macOS"
          sw_vers
          csrutil status || true
          echo "::endgroup::"

      - name: "🔍 Verify Xcode"
        run: |
          xcode-select -p
          xcodebuild -version
          echo "--- Installed SDKs ---"
          xcodebuild -showsdks
          echo "--- Simulator Runtimes ---"
          xcrun simctl list runtimes

      - name: "🔍 Verify compilers & build tools"
        run: |
          echo "clang:"; clang --version
          echo "swift:"; swift --version
          echo "make:"; make --version
          echo "cmake:"; cmake --version || echo "cmake not installed"
          echo "git:"; git --version
          echo "git-lfs:"; git lfs version || echo "git-lfs not installed"

      - name: "🔍 Verify package managers"
        run: |
          echo "brew:"; brew --version
          echo "cocoapods:"; pod --version
          echo "fastlane:"; fastlane --version || true
          echo "npm:"; npm --version
          echo "node:"; node --version
          echo "pip3:"; pip3 --version
          echo "gem:"; gem --version

      - name: "🔍 Verify Android SDK"
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::ANDROID_HOME directory does not exist"; exit 1; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null || \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null | head -40
          adb version

      - name: "🔍 Verify cloud CLIs"
        run: |
          echo "gh:"; gh --version
          echo "aws:"; aws --version || echo "aws cli not installed"
          echo "gcloud:"; gcloud --version 2>/dev/null | head -2 || echo "gcloud not installed"

      - name: "🔍 Verify language runtimes"
        run: |
          echo "java:"; java -version 2>&1 || echo "java not installed"
          echo "go:"; go version || echo "go not installed"
          echo "ruby:"; ruby --version
          echo "python3:"; python3 --version
          echo "deno:"; deno --version || echo "deno not installed"

      - name: "🔍 Check disk space"
        run: |
          df -h /
          AVAIL_GB=$(df -g / | tail -1 | awk '{print $4}')
          echo "Available: ${AVAIL_GB} GB"
          if [ "$AVAIL_GB" -lt 10 ]; then
            echo "::warning::Low disk space: ${AVAIL_GB} GB available"
          fi

      # ──────────────────────────────────────────
      # 2. iOS Development Workflow
      # ──────────────────────────────────────────
      - name: "📱 Create sample iOS project"
        run: |
          mkdir -p /tmp/TestiOSApp && cd /tmp/TestiOSApp

          cat > Package.swift << 'SWIFT_EOF'
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(
              name: "TestiOSApp",
              platforms: [.iOS(.v17)],
              products: [
                  .library(name: "TestiOSApp", targets: ["TestiOSApp"]),
              ],
              targets: [
                  .target(name: "TestiOSApp", path: "Sources"),
                  .testTarget(name: "TestiOSAppTests", dependencies: ["TestiOSApp"], path: "Tests"),
              ]
          )
          SWIFT_EOF

          mkdir -p Sources Tests

          cat > Sources/Calculator.swift << 'SWIFT_EOF'
          import Foundation

          public struct Calculator {
              public init() {}

              public func add(_ a: Int, _ b: Int) -> Int { a + b }
              public func multiply(_ a: Int, _ b: Int) -> Int { a * b }
              public func fibonacci(_ n: Int) -> Int {
                  guard n > 1 else { return n }
                  return fibonacci(n - 1) + fibonacci(n - 2)
              }
          }
          SWIFT_EOF

          cat > Tests/CalculatorTests.swift << 'SWIFT_EOF'
          import XCTest
          @testable import TestiOSApp

          final class CalculatorTests: XCTestCase {
              let calc = Calculator()

              func testAdd() { XCTAssertEqual(calc.add(2, 3), 5) }
              func testMultiply() { XCTAssertEqual(calc.multiply(4, 5), 20) }
              func testFibonacci() { XCTAssertEqual(calc.fibonacci(10), 55) }
          }
          SWIFT_EOF

      - name: "📱 Build iOS library"
        run: |
          cd /tmp/TestiOSApp
          swift build
          echo "✅ Swift build succeeded"

      - name: "📱 Run unit tests"
        run: |
          cd /tmp/TestiOSApp
          swift test
          echo "✅ Swift tests passed"

      - name: "📱 Xcode SDK compilation check"
        run: |
          cd /tmp
          mkdir -p XcodeTestApp && cd XcodeTestApp

          cat > main.swift << 'SWIFT_EOF'
          import UIKit

          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = UIViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          SWIFT_EOF

          xcrun swiftc main.swift \
            -sdk $(xcrun --sdk iphonesimulator --show-sdk-path) \
            -target arm64-apple-ios17.0-simulator \
            -parse-as-library \
            -typecheck
          echo "✅ Xcode iOS SDK compilation check passed"

      - name: "📱 iPhone 16 simulator: boot, build & test"
        env:
          DEVICE_NAME: "iPhone 16"
        run: |
          # Use the newest iOS runtime that is no newer than the active Xcode's
          # simulator SDK and supports the device: an image can carry a runtime newer
          # than its Xcode, which Xcode can't drive, and the iOS 27.1 runtime only
          # supports the iPhone Duo, so with Xcode 27.1 iPhone 16 runs on iOS 27.0.
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "Xcode simulator SDK: iOS $SDK_VERSION"

          PICK=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          sdk, device = sys.argv[1], sys.argv[2]
          major_minor = lambda v: tuple(int(x) for x in v.split('.')[:2])
          ios = [r for r in json.load(sys.stdin)['runtimes'] if r['platform'] == 'iOS' and r['isAvailable']]
          usable = [r for r in ios if major_minor(r['version']) <= major_minor(sdk)]
          match = [r for r in usable if device in [d['name'] for d in r.get('supportedDeviceTypes', [])]]
          if not match:
              sys.exit('no iOS runtime up to %s supports %s; available: %s' % (sdk, device, ', '.join(r['version'] for r in ios) or 'none'))
          runtime = max(match, key=lambda r: major_minor(r['version']))
          print(runtime['identifier'], runtime['version'])
          " "$SDK_VERSION" "$DEVICE_NAME")
          read -r RUNTIME RUNTIME_VERSION <<< "$PICK"
          echo "Using runtime: $RUNTIME"

          DEVICE_ID=$(xcrun simctl create "TestDevice" "$DEVICE_NAME" "$RUNTIME")
          trap 'xcrun simctl shutdown "$DEVICE_ID" || true; xcrun simctl delete "$DEVICE_ID" || true' EXIT
          echo "Created device: $DEVICE_ID"

          xcrun simctl bootstatus "$DEVICE_ID" -b
          BOOTED_VERSION=$(xcrun simctl getenv "$DEVICE_ID" SIMULATOR_RUNTIME_VERSION)
          echo "Booted $DEVICE_NAME on iOS $BOOTED_VERSION"
          test "$(echo "$BOOTED_VERSION" | cut -d. -f1-2)" = "$(echo "$RUNTIME_VERSION" | cut -d. -f1-2)" || { echo "::error::booted iOS $BOOTED_VERSION, expected $RUNTIME_VERSION"; exit 1; }

          # swift build/test above ran on macOS; this builds the package for iOS
          # and runs its tests inside the booted simulator.
          cd /tmp/TestiOSApp
          xcodebuild test -scheme TestiOSApp -destination "id=$DEVICE_ID" > /tmp/xcodebuild-ios-test.log 2>&1 \
            || { tail -50 /tmp/xcodebuild-ios-test.log; exit 1; }
          grep -E "Executed [0-9]+ test|TEST SUCCEEDED" /tmp/xcodebuild-ios-test.log
          grep -qE "Executed [1-9][0-9]* tests?, with 0 failures" /tmp/xcodebuild-ios-test.log \
            || { echo "::error::no iOS tests were executed"; exit 1; }
          echo "✅ Built and tested on $DEVICE_NAME, iOS $BOOTED_VERSION"

      - name: "📱 iOS 27.1 simulator: boot newest supported iPhone"
        env:
          IOS_RUNTIME: "27.1"
        run: |
          # Boots the newest iPhone the iOS 27.1 runtime supports (it only supports
          # the iPhone Duo) and builds and tests the package on it. Xcode 27.0 stays
          # the image default, so this step selects Xcode 27.1 when it is installed;
          # with no Xcode that has the 27.1 SDK it only proves the runtime boots.
          if [ -d "/Applications/Xcode_$IOS_RUNTIME.app" ]; then
            export DEVELOPER_DIR="/Applications/Xcode_$IOS_RUNTIME.app/Contents/Developer"
          fi
          xcodebuild -version
          PICK=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          want = sys.argv[1]
          ios = [r for r in json.load(sys.stdin)['runtimes'] if r['platform'] == 'iOS' and r['isAvailable']]
          match = [r for r in ios if r['version'].split('.')[:2] == want.split('.')]
          if not match:
              print('none')
              sys.exit()
          runtime = match[-1]
          iphones = [d for d in runtime.get('supportedDeviceTypes', []) if d.get('productFamily') == 'iPhone']
          print('Supported iPhones:', ', '.join(d['name'] for d in iphones) or 'none', file=sys.stderr)
          if not iphones:
              sys.exit('iOS %s runtime supports no iPhone' % runtime['version'])
          print(runtime['identifier'], iphones[-1]['identifier'])
          " "$IOS_RUNTIME")
          if [ "$PICK" = "none" ]; then
            echo "::notice::iOS $IOS_RUNTIME runtime is not installed on this image; skipping"
            exit 0
          fi
          read -r RUNTIME DEVICE_TYPE <<< "$PICK"
          echo "Using runtime: $RUNTIME"
          echo "Using device type: $DEVICE_TYPE"

          DEVICE_ID=$(xcrun simctl create "TestDevice-$IOS_RUNTIME" "$DEVICE_TYPE" "$RUNTIME")
          trap 'xcrun simctl shutdown "$DEVICE_ID" || true; xcrun simctl delete "$DEVICE_ID" || true' EXIT
          echo "Created device: $DEVICE_ID"

          xcrun simctl bootstatus "$DEVICE_ID" -b
          BOOTED_VERSION=$(xcrun simctl getenv "$DEVICE_ID" SIMULATOR_RUNTIME_VERSION)
          test "$(echo "$BOOTED_VERSION" | cut -d. -f1-2)" = "$IOS_RUNTIME" || { echo "::error::booted iOS $BOOTED_VERSION, expected $IOS_RUNTIME"; exit 1; }
          echo "✅ iOS $BOOTED_VERSION simulator booted"

          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          if ! python3 -c "import sys; v = lambda s: tuple(int(x) for x in s.split('.')[:2]); sys.exit(v(sys.argv[1]) < v(sys.argv[2]))" "$SDK_VERSION" "$IOS_RUNTIME"; then
            echo "::notice::Xcode simulator SDK is iOS $SDK_VERSION, older than $IOS_RUNTIME; boot only"
            exit 0
          fi
          cd /tmp/TestiOSApp
          xcodebuild test -scheme TestiOSApp -destination "id=$DEVICE_ID" > /tmp/xcodebuild-ios-$IOS_RUNTIME-test.log 2>&1 \
            || { tail -50 /tmp/xcodebuild-ios-$IOS_RUNTIME-test.log; exit 1; }
          grep -E "Executed [0-9]+ test|TEST SUCCEEDED" /tmp/xcodebuild-ios-$IOS_RUNTIME-test.log
          grep -qE "Executed [1-9][0-9]* tests?, with 0 failures" /tmp/xcodebuild-ios-$IOS_RUNTIME-test.log \
            || { echo "::error::no iOS $IOS_RUNTIME tests were executed"; exit 1; }
          echo "✅ Built and tested on iOS $BOOTED_VERSION"

      # ──────────────────────────────────────────
      # 3. CocoaPods & Fastlane
      # ──────────────────────────────────────────
      - name: "🫛 CocoaPods install"
        run: |
          pod --version
          mkdir -p /tmp/CocoapodsTest && cd /tmp/CocoapodsTest

          cat > Podfile << 'EOF'
          platform :ios, '17.0'

          target 'CocoapodsTest' do
            use_frameworks!
            pod 'Alamofire', '~> 5.9'
          end
          EOF

          mkdir -p CocoapodsTest.xcodeproj
          cat > CocoapodsTest.xcodeproj/project.pbxproj << 'PBXEOF'
          // !$*UTF8*$!
          {
            archiveVersion = 1;
            classes = {};
            objectVersion = 56;
            objects = {
              2D4F2C002B00000000000000 = {isa = PBXGroup; children = (); sourceTree = "<group>"; };
              2D4F2C012B00000000000000 = {isa = PBXProject; buildConfigurationList = 2D4F2C042B00000000000000; compatibilityVersion = "Xcode 14.0"; mainGroup = 2D4F2C002B00000000000000; productRefGroup = 2D4F2C002B00000000000000; projectDirPath = ""; projectRoot = ""; targets = (2D4F2C052B00000000000000); };
              2D4F2C042B00000000000000 = {isa = XCConfigurationList; buildConfigurations = (2D4F2C062B00000000000000); defaultConfigurationName = Release; };
              2D4F2C052B00000000000000 = {isa = PBXNativeTarget; buildConfigurationList = 2D4F2C072B00000000000000; buildPhases = (); buildRules = (); dependencies = (); name = CocoapodsTest; productName = CocoapodsTest; productType = "com.apple.product-type.application"; };
              2D4F2C062B00000000000000 = {isa = XCBuildConfiguration; buildSettings = { ALWAYS_SEARCH_USER_PATHS = NO; SDKROOT = iphoneos; IPHONEOS_DEPLOYMENT_TARGET = 17.0; }; name = Release; };
              2D4F2C072B00000000000000 = {isa = XCConfigurationList; buildConfigurations = (2D4F2C082B00000000000000); defaultConfigurationName = Release; };
              2D4F2C082B00000000000000 = {isa = XCBuildConfiguration; buildSettings = { PRODUCT_BUNDLE_IDENTIFIER = com.test.CocoapodsTest; PRODUCT_NAME = "$(TARGET_NAME)"; SDKROOT = iphoneos; IPHONEOS_DEPLOYMENT_TARGET = 17.0; INFOPLIST_FILE = ""; }; name = Release; };
            };
            rootObject = 2D4F2C012B00000000000000;
          }
          PBXEOF

          pod install --repo-update
          echo "✅ CocoaPods install succeeded"

      - name: "🫛 Verify Fastlane"
        run: |
          fastlane --version
          fastlane env || true
          echo "✅ Fastlane is functional"

      # ──────────────────────────────────────────
      # 4. Android Development Workflow
      # ──────────────────────────────────────────
      - name: "🤖 Setup Java 17 for Android"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: "🤖 Verify Android SDK"
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools/"
          ls "$ANDROID_HOME/platforms/"
          adb version

      - name: "🤖 Create sample Android project"
        run: |
          mkdir -p /tmp/TestAndroidApp && cd /tmp/TestAndroidApp

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -1)
          PLATFORM=$(ls "$ANDROID_HOME/platforms/" | sort -V | tail -1)
          COMPILE_SDK=$(echo "$PLATFORM" | sed 's/android-//')
          echo "Using build-tools: $BUILD_TOOLS, platform: $PLATFORM (API $COMPILE_SDK)"

          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.4.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > settings.gradle << 'EOF'
          rootProject.name = 'TestAndroidApp'
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:9.1.0'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          mkdir -p app/src/main/java/com/test/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/test/java/com/test/app

          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.test.app'
              compileSdk $COMPILE_SDK

              defaultConfig {
                  applicationId "com.test.app"
                  minSdk 24
                  targetSdk $COMPILE_SDK
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              testImplementation 'junit:junit:4.13.2'
          }
          EOF

          # Find a Java 17 or 21 JDK for Android compilation
          # (Java 26 jlink is incompatible with Android SDK's core-for-system-modules.jar)
          JAVA17_HOME=$(find /Library/Java/JavaVirtualMachines -maxdepth 1 -name "*17*" -type d 2>/dev/null | head -1)
          JAVA21_HOME=$(find /Library/Java/JavaVirtualMachines -maxdepth 1 -name "*21*" -type d 2>/dev/null | head -1)
          if [ -n "$JAVA17_HOME" ]; then
            ANDROID_JAVA_HOME="$JAVA17_HOME/Contents/Home"
          elif [ -n "$JAVA21_HOME" ]; then
            ANDROID_JAVA_HOME="$JAVA21_HOME/Contents/Home"
          fi

          if [ -n "$ANDROID_JAVA_HOME" ] && [ -d "$ANDROID_JAVA_HOME" ]; then
            echo "Using JDK for Android build: $ANDROID_JAVA_HOME"
            echo "org.gradle.java.home=$ANDROID_JAVA_HOME" > gradle.properties
          else
            echo "::warning::No Java 17/21 JDK found, Android build may fail with Java 26 jlink issue"
          fi

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="TestApp">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/test/app/MainActivity.java << 'EOF'
          package com.test.app;

          import android.app.Activity;
          import android.os.Bundle;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }

              public int add(int a, int b) {
                  return a + b;
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">TestApp</string>
          </resources>
          EOF

          cat > app/src/test/java/com/test/app/MainActivityTest.java << 'EOF'
          package com.test.app;

          import org.junit.Test;
          import static org.junit.Assert.*;

          public class MainActivityTest {
              @Test
              public void testAdd() {
                  MainActivity activity = new MainActivity();
                  assertEquals(5, activity.add(2, 3));
              }
          }
          EOF

      - name: "🤖 Build Android project"
        run: |
          cd /tmp/TestAndroidApp

          gradle wrapper --gradle-version 9.4.1 2>/dev/null || {
            curl -sL https://services.gradle.org/distributions/gradle-9.4.1-bin.zip -o /tmp/gradle.zip
            unzip -qo /tmp/gradle.zip -d /tmp
            /tmp/gradle-9.4.1/bin/gradle wrapper --gradle-version 9.4.1
          }

          ./gradlew assembleDebug --no-daemon --warning-mode=none
          echo "✅ Android build succeeded"

      - name: "🤖 Run Android unit tests"
        run: |
          cd /tmp/TestAndroidApp
          ./gradlew testDebugUnitTest --no-daemon --warning-mode=none
          echo "✅ Android unit tests passed"

      # ──────────────────────────────────────────
      # 5. Multi-Language Build Tests
      # ──────────────────────────────────────────
      - name: "🔨 Go - build & test"
        run: |
          mkdir -p /tmp/GoTest && cd /tmp/GoTest
          cat > main.go << 'EOF'
          package main

          import "fmt"

          func Add(a, b int) int { return a + b }

          func main() {
              fmt.Println("Result:", Add(2, 3))
          }
          EOF

          cat > main_test.go << 'EOF'
          package main

          import "testing"

          func TestAdd(t *testing.T) {
              if Add(2, 3) != 5 {
                  t.Fatal("expected 5")
              }
          }

          func BenchmarkAdd(b *testing.B) {
              for i := 0; i < b.N; i++ {
                  Add(2, 3)
              }
          }
          EOF

          go mod init gotest
          go build -v .
          go test -v -bench=. .
          echo "✅ Go build & test passed"

      - name: "🔨 Node.js - build & test"
        run: |
          mkdir -p /tmp/NodeTest && cd /tmp/NodeTest

          cat > package.json << 'EOF'
          {
            "name": "node-test",
            "version": "1.0.0",
            "scripts": {
              "test": "node test.js",
              "lint": "eslint src/ || true",
              "typecheck": "tsc --noEmit"
            }
          }
          EOF

          mkdir -p src
          cat > src/index.ts << 'EOF'
          export function greet(name: string): string {
            return `Hello, ${name}!`;
          }

          export function factorial(n: number): number {
            if (n <= 1) return 1;
            return n * factorial(n - 1);
          }
          EOF

          cat > tsconfig.json << 'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "commonjs",
              "strict": true,
              "outDir": "dist",
              "rootDir": "src"
            },
            "include": ["src"]
          }
          EOF

          cat > test.js << 'EOF'
          const assert = require("assert");
          assert.strictEqual(typeof process.version, "string");
          console.log("Node version:", process.version);
          console.log("All assertions passed");
          EOF

          npm install
          npx tsc --noEmit
          npm test
          echo "✅ Node.js TypeScript check & test passed"

      - name: "🔨 Python - build & test"
        run: |
          mkdir -p /tmp/PythonTest && cd /tmp/PythonTest

          cat > calculator.py << 'EOF'
          def add(a: int, b: int) -> int:
              return a + b

          def fibonacci(n: int) -> int:
              if n <= 1:
                  return n
              a, b = 0, 1
              for _ in range(2, n + 1):
                  a, b = b, a + b
              return b
          EOF

          cat > test_calculator.py << 'EOF'
          import unittest
          from calculator import add, fibonacci

          class TestCalculator(unittest.TestCase):
              def test_add(self):
                  self.assertEqual(add(2, 3), 5)

              def test_fibonacci(self):
                  self.assertEqual(fibonacci(10), 55)

              def test_fibonacci_zero(self):
                  self.assertEqual(fibonacci(0), 0)

          if __name__ == "__main__":
              unittest.main()
          EOF

          python3 -m pytest test_calculator.py -v 2>/dev/null || python3 -m unittest test_calculator -v
          echo "✅ Python test passed"

      - name: "🔨 Ruby - build & test"
        run: |
          mkdir -p /tmp/RubyTest && cd /tmp/RubyTest

          cat > calculator.rb << 'EOF'
          class Calculator
            def add(a, b) = a + b
            def multiply(a, b) = a * b
          end
          EOF

          cat > test_calculator.rb << 'EOF'
          require 'minitest/autorun'
          require_relative 'calculator'

          class TestCalculator < Minitest::Test
            def setup
              @calc = Calculator.new
            end

            def test_add
              assert_equal 5, @calc.add(2, 3)
            end

            def test_multiply
              assert_equal 20, @calc.multiply(4, 5)
            end
          end
          EOF

          ruby test_calculator.rb
          echo "✅ Ruby test passed"

      - name: "🔨 C/C++ - compile & run"
        run: |
          mkdir -p /tmp/CTest && cd /tmp/CTest

          cat > main.c << 'EOF'
          #include <stdio.h>
          #include <assert.h>

          int factorial(int n) {
              if (n <= 1) return 1;
              return n * factorial(n - 1);
          }

          int main() {
              assert(factorial(5) == 120);
              assert(factorial(0) == 1);
              printf("All C tests passed\n");
              return 0;
          }
          EOF

          clang -O2 -o test_c main.c && ./test_c

          cat > main.cpp << 'EOF'
          #include <iostream>
          #include <cassert>
          #include <vector>
          #include <numeric>

          int main() {
              std::vector<int> v = {1, 2, 3, 4, 5};
              assert(std::accumulate(v.begin(), v.end(), 0) == 15);
              std::cout << "All C++ tests passed" << std::endl;
              return 0;
          }
          EOF

          clang++ -std=c++17 -O2 -o test_cpp main.cpp && ./test_cpp
          echo "✅ C/C++ compile & test passed"

      # ──────────────────────────────────────────
      # 6. CI/CD Tools & Integration Tests
      # ──────────────────────────────────────────
      - name: "⚙️ Git operations"
        run: |
          mkdir -p /tmp/GitTest && cd /tmp/GitTest
          git init
          git config user.email "test@test.com"
          git config user.name "Test"
          echo "hello" > file.txt
          git add . && git commit -m "init"
          git checkout -b feature
          echo "world" >> file.txt
          git add . && git commit -m "feature"
          git checkout main 2>/dev/null || git checkout master
          git merge feature --no-edit
          git log --oneline
          echo "✅ Git operations passed"

      - name: "⚙️ Git LFS"
        run: |
          git lfs version
          mkdir -p /tmp/LFSTest && cd /tmp/LFSTest
          git init
          git lfs install
          git lfs track "*.bin"
          cat .gitattributes
          echo "✅ Git LFS is functional"

      - name: "⚙️ Homebrew operations"
        run: |
          brew --version
          brew list | head -10
          brew info jq --json=v2 | head -5
          echo "✅ Homebrew is functional"

      - name: "⚙️ Keychain access (CI signing readiness)"
        run: |
          security list-keychains
          security find-identity -v -p codesigning || echo "No signing identities (expected in CI)"
          echo "✅ Keychain access works"

