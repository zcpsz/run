name: "⚔️ Runner Battle: GitHub vs GetMac.io"

on:
  workflow_dispatch:
    inputs:
      getmac_label:
        description: "GetMac runner label to benchmark"
        required: true
        default: "getmac-tahoe-rc"
        type: string

jobs:
  benchmark:
    name: ${{ matrix.provider }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- CONTENDER 1: GitHub Hosted ---
          - provider: 'GitHub Cloud'
            # 'macos-15' is Sequoia. If GitHub has released 'macos-26' image, use that.
            # In early 2026, 'macos-latest' likely points to macOS 15 or 16.
            runner: macos-26
            os: 'GitHub macOS Tahoe'

          # --- CONTENDER 2: GetMac.io (Self-Hosted) ---
            # IMPORTANT: Ensure your GetMac.io runner has these labels or update this line
            # You must manually update this machine to macOS 26 Tahoe to test "Version 26"
          - provider: 'GetMac.io'
            runner: ${{ inputs.getmac_label }}
            os: 'GetMac ${{ inputs.getmac_label }}'

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Benchmark Repo
        uses: actions/checkout@v4
        with:
          repository: devMEremenko/XcodeBenchmark
          ref: master

      - name: 🔍 Check Specs
        run: |
          echo "--- Hardware Info ---"
          system_profiler SPHardwareDataType | grep "Memory"
          system_profiler SPHardwareDataType | grep "Chip"

          echo "--- Remote Access Info ---"
          echo "ssh:"
          sudo systemsetup -getremotelogin
          echo "vnc:"
          launchctl list | grep -E 'com.apple.screensharing|com.apple.RemoteDesktop'

          echo "--- Software Info ---"
          sw_vers
          xcodebuild -version
        shell: bash

      - name: "🏷️ Which image is this"
        if: matrix.provider == 'GetMac.io'
        run: |
          echo "guest agent: $(/usr/local/bin/agent --version 2>&1 | head -1)"
          echo "spotlight: $(mdutil -s / 2>&1 | tail -1 | xargs)"
          echo "booted: $(sysctl -n kern.boottime)"
          echo "cpu: $(sysctl -n hw.ncpu) vCPU, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
        shell: bash

      - name: "📦 Install Dependencies (CocoaPods)"
        run: |
          # We run this to ensure the workspace and pod linkages are generated correctly
          # for the current machine's architecture.
          pod install --repo-update
        shell: bash

      - name: "🏋️ Run Heavy Load"
        run: |
          xcodebuild -workspace XcodeBenchmark.xcworkspace \
            -scheme XcodeBenchmark \
            -destination 'generic/platform=iOS' \
            clean build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -parallelizeTargets \
            -jobs 8 \
            -quiet
        shell: bash

      - name: ⏱️ Report Time
        if: always()
        run: |
          echo "Build finished on ${{ matrix.provider }}"
